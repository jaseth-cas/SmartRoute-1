# Configuración de SonarQube para SmartRoute Flutter (Penonomé, Coclé)
sonar.projectKey=SmartRoute-Flutter
sonar.projectName=SmartRoute Flutter
sonar.projectVersion=1.0.0

# Código fuente y suite de pruebas por módulos
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Análisis estático Dart/Flutter (MANUAL para escanear desde Docker sonar-scanner-cli sin SDK Flutter dentro del contenedor)
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.mode=LEGACY
sonar.dart.analyzer.report.path=coverage/analyzer.output

# Cobertura LCOV y reporte de pruebas por módulos (plugin sonar-flutter)
sonar.flutter.coverage.reportPath=coverage/lcov.info
sonar.flutter.tests.reportPath=coverage/tests.output

# Propiedad nativa (SonarQube Cloud / Developer Edition 10.7+)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusiones de archivos generados y plataformas compiladas
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,build/**,android/**,ios/**,web/**,.dart_tool/**
sonar.scm.exclusions.disabled=true
